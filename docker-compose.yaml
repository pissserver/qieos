services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${APP_PORT:-9002}:80"
        environment:
            DB_HOST: db
            DB_PORT: 3306
            DB_NAME: ${DB_NAME:-db_kantin}
            DB_USER: root
            DB_PASSWORD: ""
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: ${DB_NAME:-db_kantin}
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --silent"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    phpmyadmin:
        image: phpmyadmin:5-apache
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        ports:
            - "${PHPMYADMIN_PORT:-9003}:80"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

volumes:
    mysql_data:
